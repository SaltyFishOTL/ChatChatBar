name: Release APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version, for example 1.0.2 or v1.0.2"
        required: true
        type: string
      releaseNotes:
        description: "Release notes"
        required: true
        type: string
      runTests:
        description: "Run JVM tests when explicitly requested"
        required: false
        default: false
        type: boolean
      resumeRelease:
        description: "Finish publishing an existing tag without changing its source or version"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.versionName }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.versionName }}
      RELEASE_NOTES: ${{ inputs.releaseNotes }}
      RESUME_RELEASE: ${{ inputs.resumeRelease }}
      CHATBAR_SUPABASE_URL: ${{ secrets.CHATBAR_SUPABASE_URL || 'https://rrlxofrrgfnhjfyrqvry.supabase.co' }}
      CHATBAR_SUPABASE_ANON_KEY: ${{ secrets.CHATBAR_SUPABASE_ANON_KEY || 'sb_publishable_J56aQ_JJLnank-dv1olMdg_d87xNQjD' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version
        run: |
          set -euo pipefail
          normalized_version="$(python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION_NAME"].strip()
          if version.lower().startswith("v"):
              version = version[1:]

          if not re.fullmatch(r"[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z]+)?", version):
              print("Version must look like 1.0.2 or v1.0.2")
              sys.exit(1)

          print(version)
          PY
          )"
          VERSION_NAME="${normalized_version}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION_NAME" >/dev/null; then
            if [[ "$RESUME_RELEASE" != true ]]; then
              echo "Tag v$VERSION_NAME already exists; use resumeRelease only to finish that exact source."
              exit 1
            fi
            git checkout --detach "refs/tags/v$VERSION_NAME"
            echo "Resuming immutable tag v$VERSION_NAME at $(git rev-parse HEAD)"
          elif [[ "$RESUME_RELEASE" == true ]]; then
            echo "Cannot resume: tag v$VERSION_NAME does not exist."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump Android version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("app/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          code_match = re.search(r'val\s+baseVersionCode\s*=\s*(\d+)', text)
          if not code_match:
              raise SystemExit("baseVersionCode not found")

          version_name = os.environ["VERSION_NAME"]
          version_pattern = re.compile(
              r'(versionName\s*=\s*providers\.gradleProperty\("CHATBAR_VERSION_NAME"\)\s*'
              r'\n\s*\.orElse\(providers\.environmentVariable\("CHATBAR_VERSION_NAME"\)\)\s*'
              r'\n\s*\.orElse\(")[^"]+("\)\s*'
              r'\n\s*\.get\(\))'
          )
          version_match = version_pattern.search(text)
          if not version_match:
              raise SystemExit("versionName default not found")
          current_name = re.search(r'\.orElse\("([^"]+)"\)', version_match.group(0)).group(1)
          current_code = int(code_match.group(1))
          if os.environ["RESUME_RELEASE"] == "true" and current_name != version_name:
              raise SystemExit("Tagged source version does not match the requested release")
          if current_name == version_name:
              # A previous attempt may have pushed metadata before tag publication failed.
              next_code = current_code
              print(f"Resuming prepared version {version_name} with versionCode {next_code}")
          else:
              next_code = current_code + 1
          text, code_updates = re.subn(
              r'val\s+baseVersionCode\s*=\s*\d+',
              f'val baseVersionCode = {next_code}',
              text,
              count=1,
          )
          text, version_updates = version_pattern.subn(
              lambda match: f"{match.group(1)}{version_name}{match.group(2)}",
              text,
              count=1,
          )
          if code_updates != 1:
              raise SystemExit("baseVersionCode update failed")
          if version_updates != 1:
              raise SystemExit("versionName default update failed")
          path.write_text(text, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"versionCode={next_code}\n")
              output.write(f"versionName={version_name}\n")
          PY

      - name: Decode release keystore
        run: |
          set -euo pipefail
          mkdir -p app/app/keystore
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > app/app/keystore/release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Validate Supabase configuration
        run: |
          set -euo pipefail
          if [[ -z "${CHATBAR_SUPABASE_URL}" || -z "${CHATBAR_SUPABASE_ANON_KEY}" ]]; then
            echo "Missing CHATBAR_SUPABASE_URL or CHATBAR_SUPABASE_ANON_KEY"
            exit 1
          fi
          echo "Supabase configuration ready; release APK will include Community backend configuration."

      - name: Compile application and test sources
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Run requested JVM tests
        if: ${{ inputs.runTests }}
        working-directory: app
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build signed release APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/app/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CHATBAR_VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          CHATBAR_VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare release asset
        run: |
          release_apk="$(find app/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          if [[ -z "${release_apk}" ]]; then
            echo "Signed release APK not found"
            exit 1
          fi
          cp "${release_apk}" "ChatBar-${VERSION_NAME}.apk"

      - name: Commit version bump and tag
        if: ${{ !inputs.resumeRelease }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "Version metadata already prepared; keeping the existing commit."
          else
            git commit -m "Release $VERSION_NAME"
          fi
          push_ref() {
            local source_ref="$1" target_ref="$2" expected actual attempt
            expected="$(git rev-parse "$source_ref")"
            for attempt in 1 2 3; do
              if git push origin "$source_ref:$target_ref"; then
                return 0
              fi
              echo "::warning::Push attempt $attempt failed for $target_ref; checking remote state."
              actual="$(git ls-remote --refs origin "$target_ref" | awk '{print $1}')" || actual=""
              if [[ "$actual" == "$expected" ]]; then
                echo "Remote $target_ref already matches $expected; push was applied despite the error."
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep "$((attempt * 5))"
              fi
            done
            echo "::error::Could not publish $target_ref after three attempts."
            return 1
          }
          push_ref HEAD "refs/heads/$GITHUB_REF_NAME"
          # Use the Git database API: Git receive-pack has returned persistent 500s for tags.
          # Create the annotated object first, then its ref; never update an existing tag.
          tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="v$VERSION_NAME" -f message="ChatBar $VERSION_NAME" \
            -f object="$(git rev-parse HEAD)" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=github-actions[bot]@users.noreply.github.com' --jq .sha)"
          tag_published=false
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/v$VERSION_NAME" -f sha="$tag_object"; then
              tag_published=true
              break
            fi
            echo "::warning::Tag ref creation attempt $attempt failed; checking remote state."
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION_NAME" --jq .object.sha)" || actual=""
            if [[ "$actual" == "$tag_object" ]]; then
              echo "Remote tag already matches $tag_object; API write was applied despite the error."
              tag_published=true
              break
            fi
            if [[ -n "$actual" ]]; then
              echo "::error::Tag now points to another object; refusing to overwrite it."
              exit 1
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 5))"
            fi
          done
          if [[ "$tag_published" != true ]]; then
            echo "::error::Could not create the tag ref after three attempts."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import time

          repo = os.environ["GITHUB_REPOSITORY"]
          version = os.environ["VERSION_NAME"]
          tag = f"v{version}"
          notes = os.environ["RELEASE_NOTES"]
          apk = Path(f"ChatBar-{version}.apk")
          digest = "sha256:" + hashlib.sha256(apk.read_bytes()).hexdigest()

          def api(path, method="GET", payload=None, file=None):
              args = ["gh", "api", path, "--method", method]
              if file is not None:
                  args += ["--input", str(file), "-H", "Content-Type: application/vnd.android.package-archive"]
              elif payload is not None:
                  args += ["--input", "-"]
              result = subprocess.run(args, input=json.dumps(payload) if payload is not None else None,
                                      capture_output=True, text=True, check=False)
              if result.returncode:
                  raise RuntimeError(result.stderr.strip())
              return json.loads(result.stdout)

          for attempt in range(1, 4):
              try:
                  releases = api(f"repos/{repo}/releases?per_page=100")
                  release = next((item for item in releases if item["tag_name"] == tag), None)
                  if release is None:
                      release = api(f"repos/{repo}/releases", "POST", {
                          "tag_name": tag, "name": f"ChatBar {version}", "body": notes,
                          "draft": True, "prerelease": False,
                      })
                  release_id = release["id"]
                  asset = next((item for item in release["assets"] if item["name"] == apk.name), None)
                  if asset is None:
                      asset = api(f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={apk.name}",
                                  "POST", file=apk)
                  if asset["state"] != "uploaded" or asset["size"] != apk.stat().st_size or asset.get("digest") != digest:
                      raise SystemExit("Existing release asset differs from this build; refusing to overwrite it.")
                  if release["draft"] or release["body"] != notes or release["prerelease"]:
                      api(f"repos/{repo}/releases/{release_id}", "PATCH", {
                          "name": f"ChatBar {version}", "body": notes,
                          "draft": False, "prerelease": False,
                      })
                  published = api(f"repos/{repo}/releases/{release_id}")
                  if published["draft"] or published["prerelease"] or published["body"] != notes:
                      raise RuntimeError("Published release metadata does not match")
                  print(published["html_url"])
                  break
              except RuntimeError as error:
                  print(f"::warning::Release publication attempt {attempt} failed: {error}")
                  if attempt == 3:
                      raise SystemExit("Release publication failed after three attempts")
                  time.sleep(attempt * 5)
          PY
