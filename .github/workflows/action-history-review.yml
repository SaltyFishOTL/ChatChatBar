name: Android action history projection
on:
  push:
    branches: [feature/action-history-projection-20261115]
    paths-ignore: ['.agents/**', 'docs/**', 'doc/**']
concurrency:
  group: action-history-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CHATBAR_VERSION_NAME: 1.4.12-action-history-review
      VERSION_REVIEW_FIXTURE_DIR: ${{ github.workspace }}/action-history-review/fixtures
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Record source and isolated test identity
        shell: python
        run: |
          import pathlib,subprocess,json
          root=pathlib.Path.cwd();out=root/'action-history-review';out.mkdir()
          (out/'source.json').write_text(json.dumps(dict(source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),syntheticOnly=True,realAccountCalls=False)),encoding='utf-8')
          p=root/'app/app/build.gradle.kts';s=p.read_text();assert 'applicationId = "com.example.chatbar"' in s;p.write_text(s.replace('applicationId = "com.example.chatbar"','applicationId = "com.example.chatbar.actionhistory.r1"'))
          p=root/'app/app/src/main/res/values/strings.xml';s=p.read_text();p.write_text(s.replace('name="app_name">ChatChatBar<','name="app_name">CCB 行动过滤内部核对<'))
          (out/'test-identity.patch').write_bytes(subprocess.check_output(['git','diff']))
      - name: Compile and run affected policy repository transfer neighbors
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests '*ChatHistoryActionProjectionTest' --tests '*ChatHistoryPromptPolicyTest' --tests '*RoleplayActionOptionsPolicyTest' :app:compileDebugAndroidTestKotlin :app:assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/action-history-native-review.sh
      - name: Verify APK identity and signature
        shell: python
        run: |
          import pathlib,subprocess,os,hashlib,json,zipfile
          apk=pathlib.Path('app/app/build/outputs/apk/debug/app-debug.apk');out=pathlib.Path('action-history-review')
          with zipfile.ZipFile(apk) as archive:
            assert all(b'SafeBatchOfflineActivity' not in archive.read(name) for name in archive.namelist() if name.endswith('.dex'))
          sdk=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools';tool=max((p for p in sdk.iterdir() if (p/'apksigner').is_file()),key=lambda p:tuple(int(x) for x in p.name.split('.') if x.isdigit()))
          result=subprocess.check_output([str(tool/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True);(out/'apk-signature.txt').write_text(result)
          result=subprocess.check_output([str(tool/'aapt'),'dump','badging',str(apk)],text=True);assert "name='com.example.chatbar.actionhistory.r1'" in result;(out/'apk-badging.txt').write_text(result)
          (out/'apk-identity.json').write_text(json.dumps(dict(bytes=apk.stat().st_size,sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),signatureVerified=True,applicationId='com.example.chatbar.actionhistory.r1')))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-history-review-originals
          path: |
            action-history-review/
            app/app/build/test-results/
            app/app/build/outputs/androidTest-results/
            app/app/build/outputs/apk/debug/
